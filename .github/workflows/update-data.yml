name: update-data

# 每天北京时间 07:00(UTC 23:00)采集一次;也可在 Actions 页手动触发。
# 本机 launchd 兜底见 scripts/launchd/,两者请错开时间,不要同时跑(数据写入遵循「先提交者为准」)。

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "每个主题的搜索页数(默认 10)"
        required: false
        default: "10"

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 按主题清单采集
        run: |
          python3 collector/generate.py --topics topics.yml --pages "${{ github.event.inputs.pages || '10' }}"

      - name: 校验索引可读
        run: python3 collector/generate.py --list

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          if git diff --cached --quiet; then
            echo "本次没有数据变化,跳过提交"
          else
            git commit -m "data: 定时采集 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
