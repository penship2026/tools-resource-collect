name: update-data

# 每天北京时间 07:00(UTC 23:00)采集一次;也可在 Actions 页手动触发。
# 公网唯一自动写入方；板块/主题查询由 topics.yml 提供。本机设置页不发布。
# 部分主题失败时 CLI 退出 0，仍继续校验并提交已成功数据。

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "每个主题的搜索页数(默认 3)"
        required: false
        default: "3"

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 按主题清单采集
        run: |
          python3 collector/generate.py --topics topics.yml --pages "${{ github.event.inputs.pages || '3' }}"

      - name: 校验索引与数据一致性
        run: |
          python3 collector/generate.py --list
          python3 collector/generate.py --verify

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          if git diff --cached --quiet; then
            echo "本次没有数据变化,跳过提交"
          else
            git commit -m "data: 定时采集 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
