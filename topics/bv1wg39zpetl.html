<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全158集【影子跟读英语新概念第一册动画 · 视频合集</title>
  <meta name="description" content="全158集【影子跟读英语新概念第一册动画 系列视频合集,按发布日期汇总">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <a href="../index.html">
          <span class="brand-mark">◈</span>
          <span>神奇网站挖掘机</span>
        </a>
      </div>
      <div class="header-meta">主题合集</div>
    </div>
  </header>

  <main class="wrap">
    <div class="crumb"><a href="../index.html">全部主题</a><span>/</span><span id="crumb-title">—</span></div>

    <section class="hero" style="padding-top:16px">
      <h1 id="topic-title">—</h1>
      <p class="sub" id="topic-slogan">—</p>
      <div class="facts">
        <div class="fact"><b id="stat-count">0</b><span>收录期数</span></div>
        <div class="fact"><b id="stat-latest">—</b><span>最新发布</span></div>
        <div class="fact"><b id="stat-span">—</b><span>时间跨度</span></div>
      </div>
      <div class="topic-meta" id="topic-meta"></div>
    </section>

    <div class="section-title">
      <h2>全部视频</h2>
      <a class="hint" id="source-link" href="#" target="_blank" rel="noopener">查看 UP 主主页 →</a>
    </div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="搜索视频标题,输入关键词过滤…">
      <span class="stat" id="result-stat"></span>
    </div>

    <div id="video-grid"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>视频来自 B站公开投稿,版权归原作者所有;点击卡片将跳转至 B站观看。</div>
      <div><a href="../index.html">← 返回全部主题</a></div>
    </div>
  </footer>

  <script src="../assets/data/index.js"></script>
  <script>window.TOPIC_DATA = window.TOPIC_DATA || {};</script>
  <script src="../assets/data/bv1wg39zpetl.js"></script>
  <script>
    const id = 'bv1wg39zpetl';
    const topic = window.TOPIC_DATA[id];
    if (!topic) {
      document.body.innerHTML = '<div class="wrap"><p>未找到该主题数据,请返回首页。</p></div>';
      throw new Error('topic data not found');
    }

    document.title = topic.title + ' · 视频合集';
    document.getElementById('crumb-title').textContent = topic.title;
    document.getElementById('topic-title').textContent = topic.title;
    document.getElementById('topic-slogan').textContent = topic.slogan;
    document.getElementById('source-link').href = topic.source.url;

    const vids = topic.videos;

    // 简介(发布者改到下方按作者分组显示)
    const metaBox = document.getElementById('topic-meta');
    const brief = (vids.find(v => v.desc)?.desc || '').slice(0, 120);
    metaBox.innerHTML = brief ? '<div class="topic-meta-row"><span class="label">简介</span><span class="value">' + brief + '</span></div>' : '';

    document.getElementById('stat-count').textContent = vids.length;
    document.getElementById('stat-latest').textContent = vids.length ? vids[0].date : '—';
    document.getElementById('stat-span').textContent = vids.length ? vids[0].date + ' – ' + vids[vids.length-1].date : '—';

    const grid = document.getElementById('video-grid');
    const search = document.getElementById('search');
    const resultStat = document.getElementById('result-stat');

    function cardHtml(v) {
      return `
        <a class="video-card" href="${v.url}" target="_blank" rel="noopener">
          <div class="video-thumb">
            <img src="${v.cover}" alt="${v.title}" loading="lazy" referrerpolicy="no-referrer">
            <span class="play"><i>▶</i></span>
            <span class="views">▶ ${v.views}</span>
          </div>
          <div class="video-info">
            <h3>${v.title}</h3>
            ${v.desc ? '<p class="desc">' + v.desc + '</p>' : ''}
            <div class="meta"><span>${v.date}</span><span>B站 · ${v.bv}</span></div>
          </div>
        </a>`;
    }

    function render(list) {
      if (!list.length) {
        grid.innerHTML = '<div class="empty">没有匹配的视频,换个关键词试试</div>';
        resultStat.textContent = `显示 0 / ${vids.length} 期`;
        return;
      }
      // 按发布者分组:多个作者时先按作者分类,再列视频
      const groups = {};
      list.forEach(v => {
        const a = v.author || '未标注作者';
        (groups[a] = groups[a] || []).push(v);
      });
      const names = Object.keys(groups);
      if (names.length > 1) {
        grid.innerHTML = names.map(a => `
          <section class="author-section">
            <h3 class="author-heading">${a} <span>${groups[a].length} 期</span></h3>
            <div class="video-grid">${groups[a].map(cardHtml).join('')}</div>
          </section>`).join('');
      } else {
        grid.innerHTML = `<div class="video-grid">${list.map(cardHtml).join('')}</div>`;
      }
      resultStat.textContent = `显示 ${list.length} / ${vids.length} 期`;
    }

    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      render(q ? vids.filter(v => v.title.toLowerCase().includes(q) || v.bv.toLowerCase().includes(q) || (v.desc || '').toLowerCase().includes(q)) : vids);
    });
    render(vids);
  </script>
</body>
</html>
