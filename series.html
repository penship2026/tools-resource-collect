<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系列合集 · 集页</title>
  <link rel="stylesheet" href="assets/style.css">
  <!-- 主题:阻塞脚本在 <head> 里同步注入主题 CSS,避免首屏闪一下 -->
  <script src="assets/theme.js"></script>
  <noscript><link rel="stylesheet" href="assets/themes/default.css"></noscript>
  <style>
    /* ===== 子集合页专属布局样式(单独维护本页时只改这里) ===== */
    .crumb { font-size: 13px; color: var(--text-mute); margin: 18px 0; }
    .crumb a { color: var(--brand); text-decoration: none; }
    .crumb span { margin: 0 8px; }

    .hero { padding-top: 8px; }
    .hero h1 { font-size: clamp(24px, 3.4vw, 30px); font-weight: 650; letter-spacing: -.4px; margin: 0 0 8px; }
    .hero .sub { color: var(--text-sub); margin: 0 0 20px; }
    .facts { display: flex; gap: 36px; margin: 0 0 14px; }
    .fact b { display: block; font-size: 22px; font-weight: 600; }
    .fact span { font-size: 12px; color: var(--text-mute); }

    .topic-meta-row { display: flex; gap: 10px; font-size: 13px; line-height: 1.6; margin: 6px 0; }
    .topic-meta-row .label { color: var(--text-mute); flex: 0 0 40px; }
    .topic-meta-row .value { color: var(--text-sub); }

    .toolbar { display: flex; gap: 14px; align-items: center; margin: 18px 0; }
    .toolbar input {
      flex: 1; max-width: 420px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-size: 14px; outline: none;
    }
    .toolbar .stat { font-size: 12px; color: var(--text-mute); }

    .author-section { margin: 22px 0; }
    .author-heading { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    .author-heading span { font-size: 11px; color: var(--text-mute); font-weight: 400; margin-left: 8px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(256px, 1fr)); gap: var(--gap-card); }
    .video-card {
      display: block; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; text-decoration: none; color: var(--text);
    }
    .video-thumb { position: relative; aspect-ratio: 16 / 9; background: var(--bg); overflow: hidden; }
    .video-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-thumb .play {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #fff; font-size: 30px; opacity: .9;
    }
    .video-info { padding: 12px 14px 14px; }
    .video-info h3 { font-size: 14px; font-weight: 500; line-height: 1.45; margin: 0 0 8px; }
    .video-info .desc { font-size: 12px; color: var(--text-sub); margin: 0 0 8px; line-height: 1.5; }
    .video-info .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-mute); }
    .empty { padding: 40px 0; text-align: center; color: var(--text-mute); }
    /* 列表截断提示:只展示最近 N 条,其余进全量列表页 */
    .more-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      margin: 4px 0 48px; padding: 14px 18px;
      background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius-sm);
      font-size: 13px; color: var(--text-sub); flex-wrap: wrap;
    }
    .more-bar a { color: var(--brand); font-weight: 500; }
    .more-bar a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <a href="index.html"><span class="brand-mark">◈</span><span>集页</span></a>
      </div>
      <div class="header-meta">系列合集</div>
    </div>
  </header>

  <main class="wrap" data-default-id="">
    <div class="crumb"><a href="index.html">全部主题</a><span>/</span><span id="crumb-title">—</span></div>

    <section class="hero">
      <h1 id="topic-title">—</h1>
      <p class="sub" id="topic-slogan">—</p>
      <div class="facts">
        <div class="fact"><b id="stat-count">0</b><span>收录条数</span></div>
        <div class="fact"><b id="stat-latest">—</b><span>最新发布</span></div>
        <div class="fact"><b id="stat-collected">—</b><span>最近采集</span></div>
        <div class="fact"><b id="stat-span">—</b><span>时间跨度</span></div>
      </div>
      <div class="topic-meta" id="topic-meta"></div>
    </section>

    <div class="section-title">
      <h2>最近收录</h2>
      <a class="hint" id="source-link" href="#" target="_blank" rel="noopener">查看来源 →</a>
    </div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="搜索内容标题,输入关键词过滤…">
      <span class="stat" id="result-stat"></span>
    </div>

    <div id="video-grid"></div>
    <div id="more-bar"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>内容来自各平台公开投稿或发布,版权归原作者所有;点击卡片将跳转至原平台查看。</div>
      <div><a href="index.html">← 返回全部主题</a></div>
    </div>
  </footer>

  <script src="assets/data-loader.js"></script>
  <script src="assets/render.js"></script>
  <script src="assets/personal.js"></script>
  <script>
    var esc = window.escHtml;  // 统一转义:assets/data-loader.js 提供
    var id = CollectionLoader.currentId();
    var grid = document.getElementById('video-grid');
    var moreBar = document.getElementById('more-bar');
    var vids = [];
    // 合集页只展示最近 20 条,更多记录进 list.html(可筛选、可分页)
    var PAGE_LIMIT = 20;
    var unitPlatform = 'bilibili';
    // 条目渠道展示名:platform 现为稳定 key(D24),旧中文名由 Render.platLabel 兼容
    function platOf(v) {
      return Render.platLabel(v.platform || unitPlatform || 'bilibili');
    }

    // ISO 日期(YYYY-MM-DD)统一格式化为 yyyy.mm.dd
    function fmtDate(iso) {
      if (!iso) return '—';
      var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(iso);
      if (!m) return iso;
      return m[1] + '.' + ('0' + Number(m[2])).slice(-2) + '.' + ('0' + Number(m[3])).slice(-2);
    }

    if (!id) {
      document.querySelector('main').innerHTML =
        '<div class="empty">未指定合集。请从 <a href="index.html">首页</a> 选择一个主题。</div>';
    } else {
      CollectionLoader.load(id, function (topic, err) {
        if (err || !topic) {
          document.querySelector('main').innerHTML =
            '<div class="empty">未找到该合集数据(' + esc(err || '') + ')。请从 <a href="index.html">首页</a> 选择。</div>';
          return;
        }
        document.title = topic.title + ' · 系列合集 · 集页';
        document.getElementById('crumb-title').textContent = topic.title;
        document.getElementById('topic-title').textContent = topic.title;
        document.getElementById('topic-slogan').textContent = topic.slogan || '';
        if (topic.source && topic.source.url) {
          document.getElementById('source-link').href = topic.source.url;
        }
        vids = (topic.videos || []).slice().sort(function (a, b) {
          if ((b.ts || 0) !== (a.ts || 0)) return (b.ts || 0) - (a.ts || 0);
          return String(b.date || '').localeCompare(String(a.date || ''));
        });
        document.getElementById('stat-count').textContent = vids.length;
        document.getElementById('stat-latest').textContent = vids.length ? vids[0].date : '—';
        document.getElementById('stat-collected').textContent = fmtDate(topic.updated);
        document.getElementById('stat-span').textContent = vids.length
          ? vids[0].date + ' – ' + vids[vids.length - 1].date : '—';
        // 来源平台信息(多渠道:接入公众号/小红书后自动显示对应平台)
        var plat = Render.platKey(topic.source && topic.source.platform);
        unitPlatform = plat;
        var srcHtml = '<div class="topic-meta-row"><span class="label">来源</span>' +
          '<span class="value">' + esc(plat) +
          (topic.source && topic.source.name ? ' · <a href="' + esc(topic.source.url || '#') + '" target="_blank" rel="noopener" style="color:var(--brand)">' + esc(topic.source.name) + '</a>' : '') +
          '</span></div>';
        // 标签行(采集时获取,可用于首页筛选)
        var unitTags = Array.isArray(topic.tags) ? topic.tags : [];
        var tagsHtml = unitTags.length
          ? '<div class="topic-meta-row"><span class="label">标签</span><span class="value">' + esc(unitTags.join(' / ')) + '</span></div>'
          : '';
        var brief = (vids.filter(function (v) { return v.desc; })[0] || {}).desc || '';
        var briefHtml = brief
          ? '<div class="topic-meta-row"><span class="label">简介</span><span class="value">' + esc(brief.slice(0, 120)) + '</span></div>'
          : '';
        document.getElementById('topic-meta').innerHTML = srcHtml + tagsHtml + briefHtml;
        render(vids);
      });
    }

    // 卡片跳站内详情页(不直接跳源平台);源链接在详情页里提供
    // 路由统一由 assets/render.js 提供(D21)
    function detailHref(v) {
      return Render.detailHref(id, v);
    }

    function cardHtml(v) {
      var idText = v.bv ? (' · ' + v.bv) : '';
      var plat = platOf(v) + idText;
      var fav = window.Personal ? Personal.starButton({
        unit: id,
        key: v.key || v.bv || v.url || '',
        title: v.title,
        url: v.url,
        cover: v.cover,
        date: v.date,
        author: v.author || platOf(v),
        kind: v.kind || 'video',
        unitTitle: document.getElementById('topic-title').textContent
      }) : '';
      return Render.videoCard(v, {
        href: detailHref(v),
        plat: platOf(v),
        metaRight: esc(plat),
        dateText: esc(v.date),
        starHtml: fav
      });
    }

    function render(list) {
      if (!list.length) {
        grid.innerHTML = '<div class="empty">没有匹配的内容,换个关键词试试</div>';
        moreBar.innerHTML = '';
        document.getElementById('result-stat').textContent = '显示 0 / ' + vids.length + ' 条';
        return;
      }
      // 本页最多渲染 PAGE_LIMIT 条,其余在全量列表页查看
      var shown = list.slice(0, PAGE_LIMIT);
      var groups = {}, order = [];
      shown.forEach(function (v) {
        var a = v.author || '未标注作者';
        if (!groups[a]) { groups[a] = []; order.push(a); }
        groups[a].push(v);
      });
      if (order.length > 1) {
        grid.innerHTML = order.map(function (a) {
          return '<section class="author-section"><h3 class="author-heading">' + esc(a) +
            '<span>' + groups[a].length + ' 条</span></h3><div class="video-grid">' +
            groups[a].map(cardHtml).join('') + '</div></section>';
        }).join('');
      } else {
        grid.innerHTML = '<div class="video-grid">' + shown.map(cardHtml).join('') + '</div>';
      }
      document.getElementById('result-stat').textContent = '显示 ' + shown.length + ' / ' + vids.length + ' 条';
      if (window.Personal) Personal.syncStars(grid);

      // 超出上限时给出全量入口(带上当前搜索词,搜索也不丢)
      var q = document.getElementById('search').value.trim();
      var href = 'list.html?id=' + encodeURIComponent(id) + (q ? '&q=' + encodeURIComponent(q) : '');
      if (list.length > PAGE_LIMIT) {
        moreBar.innerHTML = '<span>已显示最近 ' + PAGE_LIMIT + ' 条,共 ' + list.length + ' 条</span>' +
          '<a href="' + href + '">查看全部内容(可筛选、可分页) →</a>';
      } else if (vids.length > PAGE_LIMIT) {
        moreBar.innerHTML = '<span>共 ' + vids.length + ' 条,本页显示最近 ' + PAGE_LIMIT + ' 条</span>' +
          '<a href="' + href + '">查看全部内容(可筛选、可分页) →</a>';
      } else {
        moreBar.innerHTML = '';
      }
    }

    document.getElementById('search').addEventListener('input', function (e) {
      var q = e.target.value.trim().toLowerCase();
      render(q ? vids.filter(function (v) {
        return v.title.toLowerCase().indexOf(q) >= 0 ||
          (v.bv || '').toLowerCase().indexOf(q) >= 0 ||
          (v.author || '').toLowerCase().indexOf(q) >= 0 ||
          (v.desc || '').toLowerCase().indexOf(q) >= 0;
      }) : vids);
    });
  </script>
</body>
</html>
