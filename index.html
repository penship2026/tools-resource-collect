<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>集页 · 主题内容清单</title>
  <meta name="description" content="一集一页,把值得收藏的内容收成清单。按主题汇总视频与图文,持续更新">
  <link rel="stylesheet" href="assets/style.css">
  <!-- 主题:阻塞脚本在 <head> 里同步注入主题 CSS,避免首屏闪一下 -->
  <script src="assets/theme.js"></script>
  <noscript><link rel="stylesheet" href="assets/themes/default.css"></noscript>
  <style>
    /* ===== 首页专属布局样式(单独维护本页时只改这里) ===== */
    .facts { display: flex; gap: 40px; margin-top: 24px; }
    .fact b { display: block; font-size: 26px; font-weight: 600; }
    .fact span { font-size: 12px; color: var(--text-mute); }

    .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
    .chip {
      border: 1px solid var(--border); background: var(--surface); color: var(--text-sub);
      border-radius: var(--radius-pill); padding: 7px 15px; font-size: var(--fs-sm);
      cursor: pointer; transition: color .15s, border-color .15s, background .15s;
    }
    .chip:hover { color: var(--brand); border-color: var(--brand); }
    .chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }

    .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .topic-card {
      display: block; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; text-decoration: none;
      color: var(--text); box-shadow: var(--shadow); transition: transform .15s ease;
    }
    .topic-card:hover { transform: translateY(-3px); }
    .topic-cover { position: relative; aspect-ratio: 16 / 9; background: var(--bg); overflow: hidden; }
    .topic-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .topic-cover .badge {
      /* 显式覆盖公共样式(style.css)的 top:14px 与圆角,否则 top+bottom 同时生效会把徽标拉成竖条 */
      position: absolute; left: 10px; bottom: 10px; top: auto;
      background: rgba(0,0,0,.72); color: #fff;
      font-size: 11px; padding: 4px 10px; border-radius: var(--radius-pill);
      white-space: nowrap; backdrop-filter: none; letter-spacing: .2px;
    }
    .topic-cover .type-tag {
      position: absolute; right: 10px; top: 10px; font-size: 11px; padding: 4px 9px;
      border-radius: var(--radius-pill); color: #fff; background: var(--brand);
      letter-spacing: .2px; box-shadow: 0 2px 6px rgba(0,0,0,.18);
    }
    .topic-cover .type-tag.single { background: #7a5cd6; }
    .topic-body { padding: 16px 18px 18px; }
    .topic-body h3 { font-size: 16px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.2px; }
    .topic-body .slogan { font-size: 12px; color: var(--text-sub); margin: 0 0 12px; line-height: 1.5; }
    .topic-body .foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-mute); }
    .topic-body .count { color: var(--brand); }
    /* 标签独立成行:超出两行自动截断 */
    .topic-body .tag-line {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin: 0 0 10px; line-height: 1.9;
    }
    .mini-tag {
      display: inline-block; margin-right: 4px; padding: 1px 6px; font-size: 10px;
      border: 1px solid var(--border); border-radius: 8px; color: var(--text-mute);
      max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <a href="index.html">
          <span class="brand-mark">◈</span>
          <span>集页</span>
        </a>
      </div>
      <nav class="view-switch" id="view-switch" hidden>
        <button type="button" class="view-btn" data-view="public">公开</button>
        <button type="button" class="view-btn" data-view="mine">我的 0</button>
      </nav>
      <div class="header-meta">一集一页 · 持续更新</div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>每个值得收藏的宝藏主题<br>都有一页完整清单</h1>
      <p class="sub">按主题收录各平台的视频与图文(公众号、小红书等),点开卡片即可看原片或原文。<br>清单由采集程序自动整理,持续更新。</p>
      <div class="facts">
        <div class="fact"><b id="stat-topics">0</b><span>主题系列</span></div>
        <div class="fact"><b id="stat-platforms">0</b><span>来源渠道</span></div>
        <div class="fact"><b id="stat-updated">—</b><span>最近更新</span></div>
      </div>
    </section>

    <div class="section-title">
      <h2>全部主题</h2>
      <span class="hint">点击卡片进入合集 / 单条内容</span>
    </div>

    <div class="filter-bar" id="filter-bar">
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip" data-filter="series">系列合集</button>
      <button class="chip" data-filter="single">单条精选</button>
      <!-- 平台筛选:动态生成;仅一个渠道时隐藏,接入更多采集渠道后自动出现 -->
      <span id="platform-chips" style="display:none"></span>
      <!-- 标签筛选:动态生成,取所有单元标签的并集(按出现次数取前 8 个) -->
      <span id="tag-chips"></span>
      <input type="text" id="topic-search" placeholder="搜索主题名称或发布者…" style="margin-left:auto">
    </div>

    <div class="topic-grid" id="topic-grid"></div>

    <!-- 个人收藏视图(?view=mine):数据只在本机 localStorage,不上传、不采集 -->
    <section class="mine-panel" id="mine-panel" hidden>
      <div class="mine-head">
        <h2>我的收藏 <small id="mine-stat"></small></h2>
        <div class="mine-tools">
          <button type="button" id="mine-export" class="mine-btn">导出备份</button>
          <button type="button" id="mine-import" class="mine-btn">导入</button>
          <input type="file" id="mine-file" accept=".json,application/json" hidden>
        </div>
      </div>
      <div class="mine-mode">
        <label><input type="radio" name="mine-mode" value="merge" checked> 合并(保留较新)</label>
        <label><input type="radio" name="mine-mode" value="replace"> 替换(覆盖当前,慎用)</label>
      </div>
      <div id="mine-body"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>内容来自各平台公开内容,版权归原作者所有,本站仅做链接聚合与导航。</div>
      <div>页面为固定模板,采集只更新数据;新增主题请在 <a href="collect.html">采集入口</a> 操作 →</div>
      <div>个人收藏只存在本机浏览器,可随时<a href="index.html?view=mine">导出备份或导入恢复</a>。</div>
    </div>
  </footer>

  <script src="assets/data/index.js"></script>
  <script src="assets/data-loader.js"></script>
  <script src="assets/render.js"></script>
  <script src="assets/personal.js"></script>
  <script>
    var esc = window.escHtml;  // 统一转义:assets/data-loader.js 提供
    var all = (window.COLLECTION_INDEX || window.TOPIC_INDEX || [])
      .filter(function (t) { return t.enabled !== false; }); // 关闭显示的单元不展示
    var currentFilter = 'all';
    var currentPlatform = 'all';
    var currentTag = '';
    var keyword = '';

    // 多平台合集同时出现在它包含的每个渠道筛选下
    function platformsOf(t) {
      var list = Array.isArray(t.platforms) && t.platforms.length
        ? t.platforms
        : [(t.source && t.source.platform) || 'bilibili'];
      return list.map(function (p) { return Render.platKey(p); });
    }
    function platformOf(t) { return platformsOf(t)[0]; }
    function tagsOf(t) {
      return Array.isArray(t.tags) ? t.tags : [];
    }

    document.getElementById('stat-topics').textContent = all.length;
    var updated = (window.SITE && window.SITE.updated) || '';
    // 站点日期统一 yyyy.mm.dd 格式
    document.getElementById('stat-updated').textContent = updated.replace(/-/g, '.');

    // 来源渠道统计与动态筛选:当前仅一个渠道时不显示筛选,新增渠道后自动出现
    var platforms = [];
    all.forEach(function (t) {
      platformsOf(t).forEach(function (p) {
        if (platforms.indexOf(p) < 0) platforms.push(p);
      });
    });
    document.getElementById('stat-platforms').textContent = platforms.length;

    var pWrap = document.getElementById('platform-chips');
    if (platforms.length > 1) {
      pWrap.style.display = '';
      var chipsHtml = '<button class="chip active" data-platform="all">全平台</button>';
      platforms.forEach(function (p) {
        chipsHtml += '<button class="chip" data-platform="' + esc(p) + '">' + esc(Render.platLabel(p)) + '</button>';
      });
      pWrap.innerHTML = chipsHtml;
      pWrap.querySelectorAll('.chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
          pWrap.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
          chip.classList.add('active');
          currentPlatform = chip.getAttribute('data-platform');
          render();
        });
      });
    }

    var grid = document.getElementById('topic-grid');

    // 标签筛选:统计所有单元标签出现次数,取前 8 个生成 chips
    var currentTag = '';
    (function () {
      var counts = {};
      all.forEach(function (t) {
        tagsOf(t).forEach(function (tag) {
          counts[tag] = (counts[tag] || 0) + 1;
        });
      });
      var top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 8);
      if (!top.length) return;
      var wrap = document.getElementById('tag-chips');
      var html = '<button class="chip active" data-tag="">全部标签</button>';
      top.forEach(function (tag) {
        html += '<button class="chip" data-tag="' + esc(tag) + '">' + esc(tag) + ' (' + counts[tag] + ')</button>';
      });
      wrap.innerHTML = html;
      wrap.querySelectorAll('.chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
          wrap.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
          chip.classList.add('active');
          currentTag = chip.getAttribute('data-tag');
          render();
        });
      });
    })();

    // 卡片跳转地址:只接受站内页面路由,数据里的 page 字段异常时按 type 回退
    function cardHref(t) {
      var type = t.type || 'series';
      var page = String(t.page || '');
      if (/^(index|series|list|single)\.html(\?|$)/.test(page)) return page;
      return (type === 'single' ? 'single.html?id=' : 'series.html?id=') + encodeURIComponent(t.id || '');
    }

    function render() {
      var list = all.filter(function (t) {
        if (currentFilter !== 'all' && (t.type || 'series') !== currentFilter) return false;
        if (currentPlatform !== 'all' && platformsOf(t).indexOf(currentPlatform) < 0) return false;
        if (currentTag && tagsOf(t).indexOf(currentTag) < 0) return false;
        if (keyword) {
          var hay = [t.title, (t.source && t.source.name), t.slogan].join(' ').toLowerCase();
          if (hay.indexOf(keyword) < 0) return false;
        }
        return true;
      });
      grid.innerHTML = list.length ? list.map(function (t) {
        return Render.topicCard(t, {
          href: cardHref(t),
          updated: updated,
          platName: platformOf(t),
          tags: tagsOf(t)
        });
      }).join('') : '<div class="empty">没有匹配的主题</div>';
    }

    // 只处理类型筛选;平台/标签 chip 有各自的处理器,不能被这里接管
    document.querySelectorAll('.chip[data-filter]').forEach(function (chip) {
      chip.addEventListener('click', function () {
        document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
        currentFilter = chip.getAttribute('data-filter');
        render();
      });
    });
    document.getElementById('topic-search').addEventListener('input', function (e) {
      keyword = e.target.value.trim().toLowerCase();
      render();
    });
    render();
  </script>
</body>
</html>
